# Askbase: Postgres (with pgvector) + API + Streamlit UI.
#   cp .env.example .env     (set the passwords; ANTHROPIC_API_KEY enables answering)
#   docker compose --env-file .env up -d --build
name: askbase

services:
  postgres:
    container_name: askbase-postgres
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: askbase_admin
      POSTGRES_PASSWORD: ${ASKBASE_ADMIN_PASSWORD:?set ASKBASE_ADMIN_PASSWORD in .env}
      POSTGRES_DB: askbase
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askbase_admin -d askbase"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [default]

  # One-shot: schema, seed, roles, knowledge index. The only service that holds the admin credentials.
  bootstrap:
    container_name: askbase-bootstrap
    build: .
    image: askbase-app:latest
    restart: "no"
    command: ["python", "-m", "app.bootstrap"]
    environment:
      ASKBASE_ADMIN_URL: postgresql://askbase_admin:${ASKBASE_ADMIN_PASSWORD}@postgres:5432/askbase
      ASKBASE_RO_URL: postgresql://askbase_ro:${ASKBASE_RO_PASSWORD}@postgres:5432/askbase
      ASKBASE_RO_PASSWORD: ${ASKBASE_RO_PASSWORD:?set ASKBASE_RO_PASSWORD in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default]

  # The API process only ever sees the read-only URL.
  api:
    container_name: askbase-api
    image: askbase-app:latest
    restart: unless-stopped
    environment:
      ASKBASE_RO_URL: postgresql://askbase_ro:${ASKBASE_RO_PASSWORD}@postgres:5432/askbase
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASKBASE_SQL_MODEL: ${ASKBASE_SQL_MODEL:-claude-sonnet-5-5}
      ASKBASE_FAST_MODEL: ${ASKBASE_FAST_MODEL:-claude-haiku-5-5}
      ASKBASE_DAILY_SPEND_CAP_USD: ${ASKBASE_DAILY_SPEND_CAP_USD:-2}
      ASKBASE_RATE_LIMIT_PER_MIN: ${ASKBASE_RATE_LIMIT_PER_MIN:-12}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:${ASKBASE_API_PORT:-8812}:8000"
    networks: [default, ingress_default]

  ui:
    container_name: askbase-ui
    image: askbase-app:latest
    restart: unless-stopped
    command: ["streamlit", "run", "/app/ui/app.py", "--server.port=8501", "--server.address=0.0.0.0",
              "--server.headless=true", "--client.toolbarMode=minimal", "--browser.gatherUsageStats=false",
              "--server.fileWatcherType=none"]
    environment:
      ASKBASE_API_URL: http://askbase-api:8000  # unique name: plain "api" also exists on the shared ingress network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${ASKBASE_UI_PORT:-8813}:8501"
    networks: [default, ingress_default]

volumes:
  pgdata:

networks:
  ingress_default:
    external: true
