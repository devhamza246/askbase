[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askbase"
version = "0.1.0"
description = "Chat with your Postgres database: read-only, guard-railed text-to-SQL with the SQL always shown."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hamza Hameed" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psycopg[binary,pool]>=3.1",
  "sqlglot>=25.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36", "plotly>=5.20", "pandas>=2.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*", "benchmark*"]

[tool.setuptools.package-data]
app = ["knowledge/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a Postgres reachable through ASKBASE_TEST_ADMIN_URL"]
